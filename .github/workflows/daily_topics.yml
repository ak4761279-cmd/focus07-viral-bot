name: Focus 07 On-Demand & Daily Bot

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 2 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python viral_topic_bot.py force
          else
            python viral_topic_bot.py check
          fi

      - name: Save state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bot_state.json
          git commit -m "Update bot state" || exit 0
          git push
